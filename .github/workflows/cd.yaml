name: CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            emersonic/prism-ecommerce-api:latest
            emersonic/prism-ecommerce-api:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            cd ~/prism

            NEW_TAG="${{ github.sha }}"

            echo "New API version: $NEW_TAG"

            # Get currently deployed version
            if [ -f .current_api_tag ]; then
              PREVIOUS_TAG=$(cat .current_api_tag)
            else
              PREVIOUS_TAG="latest"
            fi

            echo "Previous API version: $PREVIOUS_TAG"

            # Pull new image
            API_TAG=$NEW_TAG docker compose pull api

            # Deploy new version
            API_TAG=$NEW_TAG docker compose up -d api

            echo "Waiting for API..."

            RETRIES=10
            DELAY=3
            SUCCESS=0

            for i in $(seq 1 $RETRIES); do
              if curl --fail -s http://localhost:3000/api/v1/health > /dev/null; then
                echo "Health check successful on attempt $i"
                SUCCESS=1
                break
              fi

              echo "Attempt $i/$RETRIES: API not ready. Retrying in ${DELAY}s..."
              sleep $DELAY
            done

            if [ $SUCCESS -eq 0 ]; then

              echo "API deployment failed."
              echo "Checking API logs..."
              docker logs prism-api-1 --tail 200 || true
              echo "Starting rollback to $PREVIOUS_TAG..."

              API_TAG=$PREVIOUS_TAG docker compose pull api
              API_TAG=$PREVIOUS_TAG docker compose up -d api

              echo "Checking rollback..."

              ROLLBACK_SUCCESS=0

              for i in $(seq 1 $RETRIES); do
                if curl --fail -s http://localhost:3000/api/v1/health > /dev/null; then
                  echo "Rollback successful."
                  ROLLBACK_SUCCESS=1
                  break
                fi

                echo "Rollback attempt $i/$RETRIES..."
                sleep $DELAY
              done

              if [ $ROLLBACK_SUCCESS -eq 0 ]; then
                echo "CRITICAL: Rollback failed."
                exit 1
              fi

              exit 1
            fi

            # Save successfully deployed version
            echo "$NEW_TAG" > .current_api_tag

            echo "API deployment successful!"
            echo "Running version: $NEW_TAG"

            docker image prune -f
